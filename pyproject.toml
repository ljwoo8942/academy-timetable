[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-timetable"
version = "0.1.1"
requires-python = ">=3.9"
# Qt 6.12 is the last release series supporting Windows 10.
dependencies = ["PySide6>=6.6,<6.13", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]
