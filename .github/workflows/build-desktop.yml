name: Build desktop apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install app and build tools
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e . PyInstaller==6.22.3
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests
      - name: Build Windows executable
        run: .\scripts\build-windows.ps1
      - name: Check executable startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $python = '.\.venv\Scripts\python.exe'
          $db = & $python -c 'from PySide6.QtCore import QCoreApplication, QStandardPaths; app = QCoreApplication([]); app.setOrganizationName("AcademyTimetable"); app.setApplicationName("AcademyTimetable"); print(QStandardPaths.writableLocation(QStandardPaths.StandardLocation.AppLocalDataLocation) + "/academy-timetable.sqlite3")'
          if ($LASTEXITCODE -ne 0 -or !$db -or (Test-Path -LiteralPath $db)) {
            throw 'Expected an unused app database path.'
          }
          $app = Start-Process -FilePath '.\dist\AcademyTimetable.exe' -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60 -and !(Test-Path -LiteralPath $db); $attempt++) {
              if ($app.HasExited) { throw "App exited with code $($app.ExitCode)." }
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path -LiteralPath $db)) { throw 'App did not initialize its database.' }
            Start-Sleep -Seconds 2
            if ($app.HasExited) { throw "App exited with code $($app.ExitCode)." }
            & $python -c 'import sqlite3, sys; from pathlib import Path; from academy_timetable.db import SCHEMA_VERSION; db = sqlite3.connect(Path(sys.argv[1]).resolve().as_uri() + "?mode=ro", uri=True); assert db.execute("PRAGMA user_version").fetchone() == (SCHEMA_VERSION,); db.close()' $db
            if ($LASTEXITCODE -ne 0) { throw 'App database did not reach the expected schema version.' }
          } finally {
            if (!$app.HasExited) { taskkill /PID $app.Id /T /F | Out-Null }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/AcademyTimetable.exe
          archive: false
          if-no-files-found: error

  macos:
    name: Apple Silicon Mac
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Install app and build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . PyInstaller==6.22.3
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests
      - name: Build and archive Mac app
        run: |
          bash scripts/build-macos.sh
          ditto -c -k --keepParent 'dist/학원 시간표.app' dist/AcademyTimetable-macOS-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/AcademyTimetable-macOS-arm64.zip
          archive: false
          if-no-files-found: error
