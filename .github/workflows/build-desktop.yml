name: Build desktop apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install app and build tools
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e . PyInstaller==6.22.3
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests
      - name: Build Windows executable and installer
        run: .\scripts\build-windows.ps1
      - name: Check native Windows startup and offline installation
        env:
          QT_QPA_PLATFORM: windows
        run: .\scripts\check-windows-install.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/AcademyTimetable.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/AcademyTimetable-Setup.exe
          archive: false
          if-no-files-found: error

  macos:
    name: Apple Silicon Mac
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Install app and build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e . PyInstaller==6.22.3
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests
      - name: Build and archive Mac app
        run: |
          bash scripts/build-macos.sh
          ditto -c -k --keepParent 'dist/학원 시간표.app' dist/AcademyTimetable-macOS-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/AcademyTimetable-macOS-arm64.zip
          archive: false
          if-no-files-found: error

  publish:
    name: Publish public downloads
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: AcademyTimetable*
          path: release
          merge-multiple: true
          skip-decompress: true
      - name: Publish tested apps to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest_sha=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo 'Skipping an older main build.'
            exit 0
          fi
          tag="desktop-$GITHUB_SHA"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'Keeping the existing public release and its download files.'
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "개발 확인용 실행 파일 ${GITHUB_SHA:0:7}" \
              --notes 'GPT·GitHub 로그인과 별도 Python 설치 없이 사용할 수 있습니다. Windows 10 1809 이상 x64·Windows 11은 AcademyTimetable-Setup.exe를 열어 설치하고 완료 화면에서 앱을 실행하세요. Python 실행 환경이 포함되며 바탕화면·시작 메뉴 바로가기가 생성됩니다. AcademyTimetable.exe는 설치 없이 실행하는 파일입니다. Apple Silicon Mac은 zip 압축을 푼 뒤 학원 시간표.app을 실행하세요. Windows 배포 서명과 macOS 공증은 제공하지 않아 보안 경고가 나타날 수 있습니다.'
          fi
          gh release upload "$tag" release/AcademyTimetable-Setup.exe release/AcademyTimetable.exe release/AcademyTimetable-macOS-arm64.zip --clobber
          gh release edit "$tag" --draft=false --latest
